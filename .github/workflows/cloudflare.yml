name: CI and Cloudflare deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build:vinext

  # Browser journeys (RFQ in TR/EN, language switch, redirects) against the dev server.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # main -> production Worker (workers.dev). Needs the two repository secrets.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run deploy:vinext

  # PRs from this repo -> uploaded as a non-promoted Worker version, reachable
  # at its preview URL; production traffic is untouched. Fork PRs get no secrets.
  preview:
    needs: [check, e2e]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Upload preview version (not promoted)
        run: npm run deploy:vinext -- --no-promote 2>&1 | tee deploy.log
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The CLI does not print the preview URL, so build it from the API:
          # https://<first 8 chars of version id>-<worker>.<account subdomain>.workers.dev
          worker=$(sed -nE 's/.*name: "([^"]+)".*/\1/p' cloudflare.config.ts | head -1)
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          url=""
          if [ -z "$url" ]; then
            sub=$(curl -fsS -H "$auth" "$api/subdomain" | jq -r '.result.subdomain // empty' || true)
            versions=$(curl -fsS -H "$auth" "$api/scripts/${worker}/versions?per_page=10" || true)
            # newest version by creation time
            vid=$(echo "$versions" | jq -r '(.result.items // .result // []) | sort_by(.metadata.created_on // .created_on) | last | .id // empty' || true)
            if [ -n "$sub" ] && [ -n "$vid" ]; then
              url="https://${vid%%-*}-${worker}.${sub}.workers.dev"
            else
              echo "worker=$worker subdomain=${sub:-<none>} version=${vid:-<none>}"
              echo "$versions" | jq -c '.errors // .success' || true
            fi
          fi
          if [ -n "$url" ]; then
            body="Preview: $url"
          else
            body="Preview version uploaded, but its URL could not be determined. Open the Worker's Versions tab in the Cloudflare dashboard (see the workflow log)."
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body "$body"
